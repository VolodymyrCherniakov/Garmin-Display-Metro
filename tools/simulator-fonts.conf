<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <include>/etc/fonts/fonts.conf</include>
    <!-- Garmin exports TT_New_Context and TT_RunIns from its bundled FreeType.
         System FreeType can resolve those names to incompatible Garmin code.
         Use the auto-hinter to avoid the TrueType bytecode interpreter. -->
    <match target="font">
        <edit name="autohint" mode="assign"><bool>true</bool></edit>
    </match>
</fontconfig>
